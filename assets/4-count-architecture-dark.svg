<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="4. EdgeFarm Count 아키텍처. 카메라 영상에서 검출, 키포인트, 세그멘테이션을 TensorRT로 추론하고 디코드와 NMS를 CUDA 커널로 처리한 뒤 회전 상자 겹침과 중심점 거리로 추적한다. 이후 여러 집계선의 결과를 종합해 마릿수를 확정하는 경로와, 화소를 센티미터로 환산한 입력으로 Transformer 계열 모델이 체중을 예측하는 경로로 나뉜다. 돼지일 수 없는 추정 체중의 검출은 집계에서 제외한다.">
<title>4. EdgeFarm Count 아키텍처. 카메라 영상에서 검출, 키포인트, 세그멘테이션을 TensorRT로 추론하고 디코드와 NMS를 CUDA 커널로 처리한 뒤 회전 상자 겹침과 중심점 거리로 추적한다. 이후 여러 집계선의 결과를 종합해 마릿수를 확정하는 경로와, 화소를 센티미터로 환산한 입력으로 Transformer 계열 모델이 체중을 예측하는 경로로 나뉜다. 돼지일 수 없는 추정 체중의 검출은 집계에서 제외한다.</title>
