<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" width="880" height="302" role="img" aria-label="5. EdgeFarm Count 처리 속도, Orin Nano 4GB: 일반 출하 시 30–60 fps, 자돈 60–70마리 동시 통과 시 10 fps, 영상 입력부터 오버레이 출력까지 지연 누적 없음. 6. 자동 라벨링 루프: 이미지 추출, SAM 3 라벨, 프레임 선별, YOLO 학습, 실제 카운팅 정확도로 교체 판단. 카운팅 오류 구간은 클립으로 저장해 하루 약 1만 장 규모로 다시 라벨링한다.">
