<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 264" width="880" height="264" role="img" aria-label="1. People Count 파이프라인. RTSP 카메라 5대의 입력을 채널별로 감시하고, DeepStream C++ 파이프라인에서 디코드한 뒤 직접 구현한 VPI 블러 플러그인으로 전체 프레임을 비식별화한다. TensorRT 기반 YOLO로 검출하고, 직접 구현한 추적과 구역 집계 플러그인을 거쳐 MQTT와 WebSocket으로 전송한다. Orin Nano 한 대에서 5채널을 채널당 20 fps로 처리했다.">
<title>1. People Count 파이프라인. RTSP 카메라 5대의 입력을 채널별로 감시하고, DeepStream C++ 파이프라인에서 디코드한 뒤 직접 구현한 VPI 블러 플러그인으로 전체 프레임을 비식별화한다. TensorRT 기반 YOLO로 검출하고, 직접 구현한 추적과 구역 집계 플러그인을 거쳐 MQTT와 WebSocket으로 전송한다. Orin Nano 한 대에서 5채널을 채널당 20 fps로 처리했다.</title>
