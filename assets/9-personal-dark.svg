<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 278" width="880" height="278" role="img" aria-label="9. 개인 프로젝트. boardgame_ai: 보드게임 일곱 종을 한국어 웹에서 두는 로컬 AI. 유료 API 없이 탐색으로 수를 고르고, 후보끼리 랭킹전을 붙인다. VISER: 관심 분야의 기술 뉴스를 모아 일일·주간 보고서로 만드는 개인비서. 사람이 본문을 고치지 않고, 피드백과 실패 기록은 SQLite에 남는다. Stock_1000: 한국 주식 눌림 전략을 모의 운영하고 백테스트하는 시스템. 스케줄러가 장중과 장마감에 돌리고, 웹 대시보드로 확인한다. X_Idea: 저장한 도구와 아이디어를 카드로 정리하는 작업 폴더. 직접 써본 결과를 남기고, 쓸 만한 것은 주말 MVP로 만든다.">
<title>9. 개인 프로젝트. boardgame_ai: 보드게임 일곱 종을 한국어 웹에서 두는 로컬 AI. 유료 API 없이 탐색으로 수를 고르고, 후보끼리 랭킹전을 붙인다. VISER: 관심 분야의 기술 뉴스를 모아 일일·주간 보고서로 만드는 개인비서. 사람이 본문을 고치지 않고, 피드백과 실패 기록은 SQLite에 남는다. Stock_1000: 한국 주식 눌림 전략을 모의 운영하고 백테스트하는 시스템. 스케줄러가 장중과 장마감에 돌리고, 웹 대시보드로 확인한다. X_Idea: 저장한 도구와 아이디어를 카드로 정리하는 작업 폴더. 직접 써본 결과를 남기고, 쓸 만한 것은 주말 MVP로 만든다.</title>
