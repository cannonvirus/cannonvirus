<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="9. 개인 프로젝트. 네 가지 모두 문제, 구현, 현재 순서로 적었다. boardgame_ai: 전략의 우열을 기록으로 정하려고, 엔진이 규칙과 점수를 맡고 기준 전략은 paired rollout으로 수를 고르게 만들었다. 유료 API를 쓰지 않으며 후보끼리 5판씩 랭킹전을 붙여 챔피언을 교체한다. VISER: 읽은 기술 뉴스가 남지 않아, 뉴스레터를 모아 일일 브리핑과 주간 보고서를 만들고 피드백과 실패 기록을 SQLite에 보존한다. 사람이 보고서 본문을 고치지 않는다. Stock_1000: 눌림 전략을 감으로 판단하고 있어, 주도주를 점수로 고르고 이동평균 기준으로 분할 매수하며 스케줄러가 장중과 장마감에 돌린다. 실거래가 아닌 모의 운영과 백테스트다. X_Idea: 저장만 하고 써보지 않은 도구가 쌓여, 원문을 카드로 쪼개 직접 써본 뒤 기록하고 쓸 만한 것은 주말 MVP로 만든다.">
<title>9. 개인 프로젝트. 네 가지 모두 문제, 구현, 현재 순서로 적었다. boardgame_ai: 전략의 우열을 기록으로 정하려고, 엔진이 규칙과 점수를 맡고 기준 전략은 paired rollout으로 수를 고르게 만들었다. 유료 API를 쓰지 않으며 후보끼리 5판씩 랭킹전을 붙여 챔피언을 교체한다. VISER: 읽은 기술 뉴스가 남지 않아, 뉴스레터를 모아 일일 브리핑과 주간 보고서를 만들고 피드백과 실패 기록을 SQLite에 보존한다. 사람이 보고서 본문을 고치지 않는다. Stock_1000: 눌림 전략을 감으로 판단하고 있어, 주도주를 점수로 고르고 이동평균 기준으로 분할 매수하며 스케줄러가 장중과 장마감에 돌린다. 실거래가 아닌 모의 운영과 백테스트다. X_Idea: 저장만 하고 써보지 않은 도구가 쌓여, 원문을 카드로 쪼개 직접 써본 뒤 기록하고 쓸 만한 것은 주말 MVP로 만든다.</title>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
  @keyframes k4{0%{opacity:1}25.000%{opacity:0}100%{opacity:0}}.h4{opacity:0;animation:k4 6.40s steps(1) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}} .blink{animation:blink 1.2s steps(1) infinite}
</style>
