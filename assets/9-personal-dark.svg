<rect x="26.0" y="58" width="404.0" height="128" rx="7" fill="#2c400d" stroke="#8fd400" stroke-width="1.8" class="h4" style="animation-delay:0.00s"/>
<rect x="38.0" y="68" width="105.6" height="20" rx="10" fill="#2c400d" stroke="#8fd400" stroke-width="1.2"/>
<text x="48.0" y="82.0" class="mono" fill="#e6edf3" font-size="11.5" font-weight="700">boardgame_ai</text>
<text x="38.0" y="110.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">문제</text>
<text x="38.0" y="132.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">구현</text>
<text x="38.0" y="172.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">현재</text>
<text x="72.0" y="110.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">전략의 우열을 감이 아니라 기록으로 정하고 싶었다</text>
<text x="72.0" y="132.0" class="sans" fill="#9da7b3" font-size="11.5">엔진이 규칙과 점수를 맡고, 전략은 합법 행동만 본다</text>
<text x="72.0" y="150.0" class="sans" fill="#9da7b3" font-size="11.5">기준 전략은 paired rollout으로 선택, 유료 API 없음</text>
<text x="72.0" y="172.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">후보끼리 5판씩 랭킹전을 붙여 챔피언을 교체</text>
<rect x="444.0" y="58" width="404.0" height="128" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<rect x="444.0" y="58" width="404.0" height="128" rx="7" fill="#2c400d" stroke="#8fd400" stroke-width="1.8" class="h4" style="animation-delay:1.60s"/>
<rect x="456.0" y="68" width="55.6" height="20" rx="10" fill="#2c400d" stroke="#8fd400" stroke-width="1.2"/>
<text x="466.0" y="82.0" class="mono" fill="#e6edf3" font-size="11.5" font-weight="700">VISER</text>
<text x="456.0" y="110.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">문제</text>
<text x="456.0" y="132.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">구현</text>
<text x="456.0" y="172.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">현재</text>
<text x="490.0" y="110.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">읽은 기술 뉴스가 쌓이기만 하고 남지 않았다</text>
<text x="490.0" y="132.0" class="sans" fill="#9da7b3" font-size="11.5">뉴스레터를 모아 일일 브리핑과 주간 보고서를 만든다</text>
<text x="490.0" y="150.0" class="sans" fill="#9da7b3" font-size="11.5">피드백과 생성 이력, 실패 기록을 SQLite에 보존한다</text>
<text x="490.0" y="172.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">사람이 보고서 본문을 고치지 않는다</text>
<rect x="26.0" y="200" width="404.0" height="128" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<rect x="26.0" y="200" width="404.0" height="128" rx="7" fill="#2c400d" stroke="#8fd400" stroke-width="1.8" class="h4" style="animation-delay:3.20s"/>
<rect x="38.0" y="210" width="91.3" height="20" rx="10" fill="#2c400d" stroke="#8fd400" stroke-width="1.2"/>
<text x="48.0" y="224.0" class="mono" fill="#e6edf3" font-size="11.5" font-weight="700">Stock_1000</text>
<text x="38.0" y="252.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">문제</text>
<text x="38.0" y="274.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">구현</text>
<text x="38.0" y="314.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">현재</text>
<text x="72.0" y="252.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">눌림 전략이 통하는지 감으로 판단하고 있었다</text>
<text x="72.0" y="274.0" class="sans" fill="#9da7b3" font-size="11.5">주도주를 점수로 고르고 이동평균 기준으로 분할 매수</text>
<text x="72.0" y="292.0" class="sans" fill="#9da7b3" font-size="11.5">스케줄러가 장중과 장마감에 돌리고 대시보드로 본다</text>
<text x="72.0" y="314.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">실거래가 아닌 모의 운영과 백테스트</text>
