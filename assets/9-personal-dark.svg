<text x="466.0" y="224.0" class="mono" fill="#e6edf3" font-size="11.5" font-weight="700">X_Idea</text>
<text x="456.0" y="252.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">문제</text>
<text x="456.0" y="274.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">구현</text>
<text x="456.0" y="314.0" class="mono" fill="#8fd400" font-size="10.5" font-weight="700">현재</text>
<text x="490.0" y="252.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">저장만 하고 써보지 않은 도구가 쌓였다</text>
<text x="490.0" y="274.0" class="sans" fill="#9da7b3" font-size="11.5">원문을 카드로 쪼개고 1~2시간 직접 써본 뒤 기록한다</text>
<text x="490.0" y="292.0" class="sans" fill="#9da7b3" font-size="11.5">쓸 만한 것은 주말 MVP로 만들고 회고를 카드에 반영</text>
<text x="490.0" y="314.0" class="sans" fill="#e6edf3" font-size="12" font-weight="600">깨진 링크와 고립 카드는 lint로 잡는다</text>
