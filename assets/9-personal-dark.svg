<text x="26.0" y="40.0" class="sans" fill="#8fd400" font-size="16" font-weight="800">9</text>
<text x="44.0" y="40.0" class="sans" fill="#e6edf3" font-size="15" font-weight="800" letter-spacing=".2">PERSONAL PROJECTS</text>
<text x="848.0" y="40.0" class="sans" fill="#9da7b3" font-size="12.5" text-anchor="end" font-style="italic">built for my own use</text>
