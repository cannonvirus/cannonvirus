<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="주소현 Sohyun Ju, Vision AI 엔지니어. 정답이 부족한 데이터에서 학습 신호를 설계한다. 영상에서 feature 설계: 회전 상자와 키포인트, 세그멘테이션에서 몸길이, 어깨너비, 몸통 등고선을 계산하고 상관 분석과 분산팽창계수로 입력 변수를 선별했다. 라벨 대신 도메인 사실로: 면적과 체중의 상관 0.8, 도축 체중의 표준편차 5~15%를 학습 신호로 삼아 ListNet과 VarMax 손실을 직접 설계했다. 현장 정답과 대조: 출하성적서의 실제 마릿수와 총중량을 정답으로 두고 산출해 출하 단위 평균 체중 정확도 98.2%. 약지도 학습, 엣지 배포, 5년 7개월 상용 개발.">
<title>주소현 Sohyun Ju, Vision AI 엔지니어. 정답이 부족한 데이터에서 학습 신호를 설계한다. 영상에서 feature 설계: 회전 상자와 키포인트, 세그멘테이션에서 몸길이, 어깨너비, 몸통 등고선을 계산하고 상관 분석과 분산팽창계수로 입력 변수를 선별했다. 라벨 대신 도메인 사실로: 면적과 체중의 상관 0.8, 도축 체중의 표준편차 5~15%를 학습 신호로 삼아 ListNet과 VarMax 손실을 직접 설계했다. 현장 정답과 대조: 출하성적서의 실제 마릿수와 총중량을 정답으로 두고 산출해 출하 단위 평균 체중 정확도 98.2%. 약지도 학습, 엣지 배포, 5년 7개월 상용 개발.</title>
