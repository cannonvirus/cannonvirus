<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" role="img" aria-label="7. 제품 공통 엣지 기반: 각 Jetson에서 TensorRT 엔진을 빌드하는 라이브러리와 Docker 환경 분리, 대기열이 차기 전에 입력 프레임을 조절해 프레임 일괄 유실과 추적 단절에 대응, 우리 데이터의 mAP와 카운팅 정확도로 모델 교체 판단. 8. 그 밖의 경험: EdgeFarm Grow (활동량과 증체량의 상관계수 -0.84), Facepection (열화상 온도 오차 0.3도 이내), 개인 프로젝트 VISER.">
<title>7. 제품 공통 엣지 기반: 각 Jetson에서 TensorRT 엔진을 빌드하는 라이브러리와 Docker 환경 분리, 대기열이 차기 전에 입력 프레임을 조절해 프레임 일괄 유실과 추적 단절에 대응, 우리 데이터의 mAP와 카운팅 정확도로 모델 교체 판단. 8. 그 밖의 경험: EdgeFarm Grow (활동량과 증체량의 상관계수 -0.84), Facepection (열화상 온도 오차 0.3도 이내), 개인 프로젝트 VISER.</title>
